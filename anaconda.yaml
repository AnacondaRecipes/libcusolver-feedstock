anaconda_config_version: 1
upstream_sources:
  - webpage:
      url: https://api.anaconda.org/package/conda-forge/libcusolver
      regex: '"version":\s*"([^"]+)"'
    packages:
      - libcusolver
      - libcusolver-dev
      - libcusolver-static
  - webpage:
      url: https://api.anaconda.org/package/conda-forge/libcusolver
      regex: '"version":\s*"(12\.8(?:\.\d+)*)"'
    feedstock_branch: '12.8'
    version_matchspec: '>=12.8,<12.9'
    supported: true
    packages:
      - libcusolver
      - libcusolver-dev
      - libcusolver-static
